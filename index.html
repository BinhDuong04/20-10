<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20.10</title>
<meta name="theme-color" content="#100B19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Màn hình 1: Mở món quà -->
<section id="gate" class="gate" aria-labelledby="gate-title">
  <div class="gate-inner">
    <p id="gate-kicker" class="kicker"></p>
    <div class="orb" aria-hidden="true"><svg viewBox="0 0 100 90"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7BAC"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><path d="M50 86C20 62 4 46 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 18-16 34-46 58z" fill="url(#hg)"/></svg></div>
    <h1 id="gate-title" class="display"></h1>
    <p id="gate-lead" class="lead"></p>
    <button id="open-btn" class="btn" type="button"></button>
  </div>
</section>

<main id="app" class="app" hidden>
  <!-- Màn hình 2: Hero -->
  <section id="hero" class="hero">
    <div class="hero-text">
      <h2 id="hero-title" class="display"></h2>
      <p id="hero-wish" class="lead"></p>
      <p id="hero-names" class="names"></p>
    </div>
    <div class="stage" id="stage"><div class="stack" id="stack"></div></div>
    <p class="scroll-hint" aria-hidden="true">Cuộn xuống</p>
  </section>

  <!-- Màn hình 4: Thư tình -->
  <section id="letter-sec" class="section">
    <article class="letter reveal" id="letter">
      <h2 class="h2" id="letter-title"></h2>
      <div id="letter-body" class="letter-body" aria-live="polite"></div>
      <p id="letter-sign" class="sign"></p>
    </article>
  </section>

  <!-- Màn hình 5: Album -->
  <section id="album" class="section wide">
    <h2 class="h2 reveal" id="album-title"></h2>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Màn hình 6: Kết thúc -->
  <section id="finale" class="section finale">
    <div class="orb small-orb" aria-hidden="true"><svg viewBox="0 0 100 90"><path d="M50 86C20 62 4 46 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 18-16 34-46 58z" fill="url(#hg)"/></svg></div>
    <h2 class="display reveal" id="end-thanks"></h2>
    <p class="infinity reveal" id="end-inf"></p>
    <p class="lead reveal" id="end-wish"></p>
  </section>

  <footer class="credit">
    <p>Phát triển bởi <b>BeeDuong</b></p>
    <p>Liên hệ: <a href="mailto:binhduong04.dev@gmail.com">binhduong04.dev@gmail.com</a></p>
  </footer>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
  <button class="lb-btn lb-close" id="lb-close" aria-label="Đóng">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Ảnh trước">‹</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Ảnh sau">›</button>
</div>

<!-- Trình phát nhạc -->
<div class="player" id="player" hidden>
  <button id="music-toggle" class="p-btn" type="button" aria-label="Bật/tắt nhạc" aria-pressed="false"><span class="bars"><i></i><i></i><i></i></span></button>
  <div class="p-info"><span id="song-name"></span><span id="music-msg" class="p-msg"></span></div>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Âm lượng">
</div>
<audio id="audio" preload="none" loop></audio>

<script src="js/config.js"></script>
<script src="js/animations.js"></script>
<script src="js/music.js"></script>
<script src="js/gallery.js"></script>
<script src="js/main.js"></script>
</body>
</html>
